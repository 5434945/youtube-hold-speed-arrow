<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YouTube Hold Speed Arrow</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="panel">
      <header>
        <h1>YouTube Hold Speed</h1>
        <p>Tap Right Arrow to seek as usual. Hold Right Arrow to temporarily speed up playback.</p>
      </header>

      <form id="settingsForm">
        <label class="field">
          <span>Hold key</span>
          <button id="captureKey" class="key-button" type="button">Right Arrow</button>
        </label>

        <label class="field">
          <span>Hold speed</span>
          <input id="holdSpeed" type="number" min="0.25" max="16" step="0.25" value="2">
        </label>

        <label class="field">
          <span>On release</span>
          <select id="restoreMode">
            <option value="normal">Restore to 1x</option>
            <option value="previous">Restore previous speed</option>
          </select>
        </label>

        <button class="primary" type="submit">Save</button>
      </form>

      <p id="status" class="status" role="status"></p>
    </main>

    <script src="options.js"></script>
  </body>
</html>
